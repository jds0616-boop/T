<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Aviation Interpreter - Professional Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --primary: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        
        /* 설정 섹션 */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .panel { background: var(--card); border: 1px solid #334155; padding: 15px; border-radius: 12px; }
        .panel h4 { margin: 0 0 10px 0; font-size: 13px; color: var(--primary); }
        
        textarea { width: 100%; background: #0b1120; color: #10b981; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
        input, select { background: #0b1120; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; }

        .display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .box { background: var(--card); border-radius: 16px; padding: 20px; height: 500px; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; }
        .content { flex: 1; overflow-y: auto; font-size: 1.4rem; line-height: 1.7; }
        .streaming-text { color: var(--primary); font-weight: bold; border-left: 3px solid var(--primary); padding-left: 10px; margin-bottom: 25px; }
        
        .btn-start { background: var(--primary); color: #0b1120; width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-stop { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-grid">
        <!-- PDF 업로드 -->
        <div class="panel">
            <h4>📘 교재 학습 (PDF)</h4>
            <input type="file" id="pdf-upload" accept=".pdf">
            <div id="pdf-status" style="font-size:11px; margin-top:5px; color:#94a3b8;">PDF를 업로드하세요.</div>
        </div>
        <!-- 발음 교정 사전 -->
        <div class="panel">
            <h4>🎙️ 전문 용어 발음 사전 (단어:발음)</h4>
            <textarea id="pronunciation-map" rows="3" placeholder="ACARS:ay-karz&#10;ATN:A-T-N&#10;VDL:V-D-L">ACARS:ay-karz
AOC:A-O-C
ATN:A-T-N</textarea>
        </div>
    </div>

    <div class="config-panel" style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="password" id="api-key" placeholder="OpenAI API Key (sk-...)">
        <select id="voice-select"></select>
    </div>

    <div class="display-grid">
        <div class="box">
            <h3 style="font-size:11px; color:#64748b; margin:0 0 10px 0;">🇰🇷 KOREAN INPUT</h3>
            <div id="ko-content" class="content"></div>
            <div id="ko-interim" style="color:#64748b; font-style:italic;"></div>
        </div>
        <div class="box">
            <h3 style="font-size:11px; color:#64748b; margin:0 0 10px 0;">🇺🇸 ENGLISH TRANSLATION</h3>
            <div id="en-content" class="content"></div>
        </div>
    </div>

    <button id="main-btn" class="btn-start" onclick="toggleSystem()">시스템 가동 시작</button>
</div>

<script>
    let recognition;
    let isRunning = false;
    let pdfContext = "";
    let lastResultTime = Date.now();
    const synth = window.speechSynthesis;

    // 1. PDF 분석
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    document.getElementById('pdf-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('pdf-status').innerText = "⏳ 교재 분석 중...";
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let extractedText = "";
            for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                extractedText += content.items.map(item => item.str).join(" ") + " ";
            }
            pdfContext = extractedText.substring(0, 8000);
            document.getElementById('pdf-status').innerText = "✅ 학습 완료!";
        };
        reader.readAsArrayBuffer(file);
    });

    // 2. 음성 설정
    function loadVoices() {
        const voices = synth.getVoices().filter(v => v.lang.includes('en'));
        document.getElementById('voice-select').innerHTML = voices.map(v => `<option value="${v.name}">${v.name}</option>`).join('');
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    // 3. 통역 핵심 로직
    async function translateStream(text) {
        const apiKey = document.getElementById('api-key').value.trim();
        if (!apiKey) return;

        const enContent = document.getElementById('en-content');
        const currentEnDiv = document.createElement('div');
        currentEnDiv.className = "streaming-text";
        enContent.appendChild(currentEnDiv);

        let fullTranslation = "";
        
        // 용어 사전을 프롬프트에 포함
        const glossary = document.getElementById('pronunciation-map').value;

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [
                        { role: "system", content: `Aviation Interpreter. Use this context: ${pdfContext}. Use this glossary: ${glossary}. Translate Korean to natural aviation English. If the STT is 'Hey cars', it's likely 'ACARS'. Correct it.` },
                        { role: "user", content: text }
                    ],
                    stream: true,
                    temperature: 0.1
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");
                for (const line of lines) {
                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                        try {
                            const content = JSON.parse(line.substring(6)).choices[0].delta.content;
                            if (content) {
                                fullTranslation += content;
                                currentEnDiv.innerText = "→ " + fullTranslation;
                                enContent.scrollTop = enContent.scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
            }
            // 발음 교정 사전을 적용하여 말하기
            speakCorrected(fullTranslation);
        } catch (error) {}
    }

    // 4. 발음 교정 말하기 함수
    function speakCorrected(text) {
        let spokenText = text;
        const mapText = document.getElementById('pronunciation-map').value;
        const lines = mapText.split('\n');

        // 사전에 등록된 단어를 발음용 단어로 치환 (예: ACARS -> ay-karz)
        lines.forEach(line => {
            const [word, phonetic] = line.split(':');
            if (word && phonetic) {
                const regex = new RegExp(`\\b${word.trim()}\\b`, 'gi');
                spokenText = spokenText.replace(regex, phonetic.trim());
            }
        });

        const utterance = new SpeechSynthesisUtterance(spokenText);
        utterance.voice = synth.getVoices().find(v => v.name === document.getElementById('voice-select').value);
        utterance.rate = 1.0;
        synth.speak(utterance);
    }

    // [시스템 가동/중지]
    function initRecognition() {
        const SpeechRecognition = window.webkitSpeechRecognition || window.Recognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (event) => {
            lastResultTime = Date.now();
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) final = event.results[i][0].transcript;
                else interim += event.results[i][0].transcript;
            }
            document.getElementById('ko-interim').innerText = interim;
            if (final) {
                appendKo(final);
                translateStream(final);
            }
        };
        recognition.onend = () => { if(isRunning) recognition.start(); };
    }

    function appendKo(text) {
        const div = document.createElement('div');
        div.style.marginBottom = "20px";
        div.innerText = "• " + text;
        document.getElementById('ko-content').appendChild(div);
        document.getElementById('ko-content').scrollTop = document.getElementById('ko-content').scrollHeight;
    }

    function toggleSystem() {
        const btn = document.getElementById('main-btn');
        if (!isRunning) {
            isRunning = true;
            if(!recognition) initRecognition();
            recognition.start();
            btn.innerText = "시스템 작동 중지";
            btn.className = "btn-start btn-stop";
        } else {
            isRunning = false;
            recognition.stop();
            synth.cancel();
            btn.innerText = "시스템 가동 시작";
            btn.className = "btn-start";
        }
    }
    
    // 와치독
    setInterval(() => {
        if (isRunning && Date.now() - lastResultTime > 6000) {
            try { recognition.stop(); } catch(e) {}
        }
    }, 3000);

    window.onload = loadVoices;
</script>
</body>
</html>
